name: deploy

# Auto-deploy Workers when main changes.
#
# Strategy: detect which apps were touched (directly or via a shared-package
# change), run the test gate once, then deploy each affected app in parallel.
#
# The affected apps are emitted as a JSON matrix by the `changes` job, so
# adding an app means touching two places (ALL_APPS and the filter/case
# pair) rather than threading a new boolean through every job.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — token with "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Optional per-app override secrets:
#   CLOUDFLARE_API_TOKEN_TRIP — trip-mcp is the only app with a KV namespace
#     binding (CACHE), which the shared token above isn't scoped for
#     (needs Workers KV Storage:Edit in addition to Workers Scripts:Edit).
#     If this secret is set, trip-mcp's deploy step uses it instead of the
#     shared token, so the shared token doesn't need broadening for every
#     other app. See #28.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to deploy. 'none' is a dry-run that exercises the test gate without deploying."
        type: choice
        required: true
        default: none
        options:
          - none
          - all
          - oura-mcp
          - gmail-mcp
          - trip-mcp
          - github-mcp
          - therapy-mcp
          - otf-mcp
          - calendar-mcp

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      any: ${{ steps.compute.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
            oura:
              - 'apps/oura-mcp/**'
            gmail:
              - 'apps/gmail-mcp/**'
            trip:
              - 'apps/trip-mcp/**'
            github:
              - 'apps/github-mcp/**'
            therapy:
              - 'apps/therapy-mcp/**'
            otf:
              - 'apps/otf-mcp/**'
            calendar:
              - 'apps/calendar-mcp/**'
      - id: compute
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_APP: ${{ inputs.app }}
          SHARED: ${{ steps.filter.outputs.shared }}
          OURA: ${{ steps.filter.outputs.oura }}
          GMAIL: ${{ steps.filter.outputs.gmail }}
          TRIP: ${{ steps.filter.outputs.trip }}
          GITHUB_APP: ${{ steps.filter.outputs.github }}
          THERAPY: ${{ steps.filter.outputs.therapy }}
          OTF: ${{ steps.filter.outputs.otf }}
          CALENDAR: ${{ steps.filter.outputs.calendar }}
        run: |
          ALL_APPS="oura-mcp gmail-mcp trip-mcp github-mcp therapy-mcp otf-mcp calendar-mcp"
          selected=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # paths-filter has no base to diff against on dispatch, so we
            # ignore its output and honor the dropdown instead.
            case "$DISPATCH_APP" in
              none) ;;
              all)  selected="$ALL_APPS" ;;
              *)
                for app in $ALL_APPS; do
                  [[ "$app" == "$DISPATCH_APP" ]] && selected="$app"
                done
                ;;
            esac
          else
            for app in $ALL_APPS; do
              case "$app" in
                oura-mcp)     changed="$OURA" ;;
                gmail-mcp)    changed="$GMAIL" ;;
                trip-mcp)     changed="$TRIP" ;;
                github-mcp)   changed="$GITHUB_APP" ;;
                therapy-mcp)  changed="$THERAPY" ;;
                otf-mcp)      changed="$OTF" ;;
                calendar-mcp) changed="$CALENDAR" ;;
                *)            changed=false ;;
              esac
              if [[ "$changed" == "true" || "$SHARED" == "true" ]]; then
                selected="$selected $app"
              fi
            done
          fi

          matrix=$(jq -cn --arg s "$selected" \
            '{app: ($s | split(" ") | map(select(length > 0)))}')
          any=$([[ "$(jq -r '.app | length' <<<"$matrix")" -gt 0 ]] && echo true || echo false)

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$any"       >> "$GITHUB_OUTPUT"
          echo "Deploying: ${selected:-(none)}"

  test:
    needs: changes
    # Always run on workflow_dispatch so the dry-run ('app: none') still
    # exercises the test gate; otherwise skip when nothing needs deploying.
    if: needs.changes.outputs.any == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test

  deploy:
    needs: [changes, test]
    # An empty matrix is a workflow error, so gate the whole job on there
    # being at least one app to deploy.
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          # trip-mcp binds a KV namespace, which needs Workers KV
          # Storage:Edit — a scope the shared token intentionally doesn't
          # carry. Use the optional per-app secret when it's set instead of
          # widening the shared token for every other app (#28). Any future
          # app needing extra scopes follows the same pattern.
          apiToken: ${{ matrix.app == 'trip-mcp' && (secrets.CLOUDFLARE_API_TOKEN_TRIP || secrets.CLOUDFLARE_API_TOKEN) || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          command: deploy
